<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blur Card UI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Search Input -->
        <input 
            class="search-input"
            type="text"
            placeholder="Search..."
        />

        <!-- Card Wrapper -->
        <div class="card-wrapper">

            <!-- Card 1 -->
            <div class="card">

                <!-- Background Image -->
                <img 
                    src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=774"
                    class="bg-img"
                />

                <!-- Blur Layer -->
                <div 
                    class="blurred-layer"
                    style="background-image:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=774')"
                ></div>

                <!-- Content -->
                <div class="content">
                    <h3>User 123</h3>

                    <p>
                        Lorem ipsum dolor sit amet consectetur 
                        adipisicing elit.
                    </p>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
